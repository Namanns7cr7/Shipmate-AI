name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - Naman
      - feat/bedrock-on-v2
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main
      - Naman
      - feat/bedrock-on-v2
      - feat/**
      - fix/**

jobs:
  # ──────────────────────────────────────────────
  # JavaScript / TypeScript — lint & test
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Node / TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present -- --ci --passWithNoTests

  # ──────────────────────────────────────────────
  # Python — lint & test
  # ──────────────────────────────────────────────
  backend:
    name: Backend (Python / pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names;
          # treat all other issues as warnings.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Run tests with pytest
        run: PYTHONPATH=. pytest --tb=short --ignore=tests/integration -q

  # ──────────────────────────────────────────────
  # Docker — build image to catch integration issues
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shipmate-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
