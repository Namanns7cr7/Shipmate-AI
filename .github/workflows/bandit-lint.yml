name: Security Lint (bandit)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  bandit:
    name: Bandit – block eval / __import__
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (B307 eval, B302 __import__)
        run: |
          bandit -r backend/app/ -t B307,B302 --exit-zero-on-skipped -ll
