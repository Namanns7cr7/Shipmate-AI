<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipMate AI - GitHub Authorization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e2e8f0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(96, 165, 250, 0.2);
            border-top: 4px solid #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
        }
        .error {
            color: #fca5a5;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Authorizing with GitHub...</h1>
        <p>Please wait while we complete your authentication.</p>
        <div id="error"></div>
    </div>

    <script>
        // Get OAuth code and state from URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDesc = params.get('error_description');

        if (error) {
            document.getElementById('error').innerHTML = 
                `<div class="error"><strong>Authorization Failed:</strong> ${errorDesc || error}</div>`;
            setTimeout(() => {
                window.close();
            }, 3000);
        } else if (code) {
            // Exchange code for access token
            fetch('/api/github/callback?code=' + code + '&state=' + state)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Post message to parent window
                        window.opener.postMessage({
                            type: 'GITHUB_AUTH_SUCCESS',
                            access_token: data.access_token,
                            user: data.user
                        }, '*');
                        window.close();
                    } else {
                        throw new Error(data.detail || 'Authentication failed');
                    }
                })
                .catch(err => {
                    document.getElementById('error').innerHTML = 
                        `<div class="error"><strong>Authorization Failed:</strong> ${err.message}</div>`;
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                });
        }
    </script>
</body>
</html>
